[package]
name = "rosek-board-beaglebone-black"
version = "0.1.0"
edition = "2021"
description = "Board support for the BeagleBone Black (TI AM335x). Pin-Muxing, Taktkonfiguration, Speicherkarte — see PLAN.md \"Portierbarkeit: Core / Port / Derivat\"."
build = "build.rs"

[[bin]]
name = "rosek"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
rosek-port-am335x = { path = "../rosek-port-am335x" }

# build-dependencies always compile for the HOST, regardless of the crate's
# own --target - this is what makes mixing a host/std codegen crate into a
# #![no_std] firmware workspace work at all (see docs/req42/09-assets.adoc).
[build-dependencies]
rosek-config = { path = "../rosek-config" }
