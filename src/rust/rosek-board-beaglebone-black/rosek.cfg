// Static configuration for rosek-board-beaglebone-black. Grammar decided
// in issue #7, documented in docs/arc42/08-concepts.adoc. Parsed and
// turned into Rust constants at build time by rosek-config (issue #8/#9) -
// see build.rs.
//
// This is a minimal placeholder set (one trusted OS-Application, one
// task) to exercise the config -> codegen pipeline end to end. Real task
// declarations land with the scheduler (Phase 3) and memory-protection
// demo (Phase 2, issue #15) work.

OS_APPLICATION TrustedApp {
  TRUSTED = TRUE;
};

TASK MainTask {
  PRIORITY = 5;
  SCHEDULE = FULL;
  APPLICATION = TrustedApp;
};
