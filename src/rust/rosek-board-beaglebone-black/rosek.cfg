// Static configuration for rosek-board-beaglebone-black. Grammar decided
// in issue #7, documented in docs/arc42/08-concepts.adoc. Parsed and
// turned into Rust constants at build time by rosek-config (issue #8/#9) -
// see build.rs.
//
// Now maintainable via rosek-config-tui (edit <this file>) as well as by
// hand; note that saving through the TUI discards comments like this one
// (see rosek-config/src/serialize.rs doc comment) - re-add by hand if
// needed after an edit-and-save round trip.

OS_APPLICATION TrustedApp {
  TRUSTED = TRUE;
};

OS_APPLICATION NoTrustedApp {
  TRUSTED = FALSE;
};

TASK MainTask {
  PRIORITY = 5;
  SCHEDULE = FULL;
  APPLICATION = TrustedApp;
};

TASK MyTask {
  PRIORITY = 3;
  SCHEDULE = FULL;
  APPLICATION = NoTrustedApp;
};

